name: Compat GitHub latest.json

# 1) 把 R2 的 latest.json 修成 Tauri 可解析格式（android 移出 platforms）
# 2) 同步挂到 GitHub Release，兼容只查 GitHub 的旧客户端
# 3) 若配置了 R2 secrets，同时回写修正后的清单到 R2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compat-github-latest-json.yml'
      - '.github/workflows/release.yml'

env:
  R2_LATEST_URL: https://download.cursorxyz.it.com/latest.json
  R2_PUBLIC_BASE: https://download.cursorxyz.it.com

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
      CF_R2_PUBLIC_BASE_URL: ${{ secrets.CF_R2_PUBLIC_BASE_URL }}
      CF_R2_ENDPOINT: https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
    steps:
      - name: Fetch and normalize latest.json
        run: |
          set -euo pipefail
          curl -fsSL "$R2_LATEST_URL" -o latest.raw.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw = json.loads(Path('latest.raw.json').read_text(encoding='utf-8'))
          platforms = raw.get('platforms') if isinstance(raw.get('platforms'), dict) else {}
          mobile = raw.get('mobile') if isinstance(raw.get('mobile'), dict) else {}
          clean_platforms = {}
          for key, value in platforms.items():
            if not isinstance(value, dict):
              continue
            if key.startswith('android'):
              mobile[key] = value
              continue
            if value.get('url') and value.get('signature'):
              clean_platforms[key] = {
                  'url': value['url'],
                  'signature': value['signature'],
              }
          fixed = {
              'version': raw.get('version'),
              'notes': raw.get('notes') or '',
              'pub_date': raw.get('pub_date'),
              'platforms': clean_platforms,
          }
          if mobile:
              fixed['mobile'] = mobile
          Path('latest.json').write_text(json.dumps(fixed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('version:', fixed.get('version'))
          print('platforms:', ', '.join(clean_platforms.keys()))
          print('mobile:', ', '.join(mobile.keys()))
          PY

      - name: Resolve latest release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/latest" > /tmp/release.json
          tag="$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["tag_name"])')"
          rid="$(python3 -c 'import json;print(json.load(open("/tmp/release.json"))["id"])')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_id=$rid" >> "$GITHUB_OUTPUT"
          echo "target release: $tag ($rid)"

      - name: Replace latest.json asset on GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.rel.outputs.release_id }}
          RELEASE_TAG: ${{ steps.rel.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t old_ids < <(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
              --jq '.[] | select(.name=="latest.json") | .id' || true
          )
          for asset_id in "${old_ids[@]:-}"; do
            [ -n "${asset_id}" ] || continue
            echo "delete asset $asset_id"
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
          upload_url="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --jq .upload_url | sed 's/{?name,label}//')"
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "${upload_url}?name=latest.json"
          echo "GitHub OK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

      - name: Mirror fixed latest.json to R2
        if: ${{ env.CF_R2_ACCOUNT_ID != '' && env.CF_R2_ACCESS_KEY_ID != '' && env.CF_R2_SECRET_ACCESS_KEY != '' && env.CF_R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          base="${CF_R2_PUBLIC_BASE_URL:-$R2_PUBLIC_BASE}"
          base="${base%/}"
          aws s3 cp latest.json "s3://${CF_R2_BUCKET}/latest.json" \
            --endpoint-url "${CF_R2_ENDPOINT}" \
            --cache-control 'no-store, no-cache, must-revalidate, max-age=0' \
            --content-type 'application/json'
          echo "R2 OK: ${base}/latest.json"
