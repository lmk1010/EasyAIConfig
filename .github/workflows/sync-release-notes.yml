name: Sync Release Notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-notes/v*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to update, for example v1.0.67
        required: true
        type: string

jobs:
  sync:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            tag='${{ inputs.tag }}'
          else
            file=$(git diff --name-only HEAD^ HEAD -- '.github/release-notes/v*.md' | tail -n 1)
            tag=$(basename "$file" .md)
          fi
          test -f ".github/release-notes/${tag}.md"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Update published release description
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        with:
          script: |
            const fs = require('fs');
            const tag = process.env.RELEASE_TAG;
            const changelog = fs.readFileSync(`.github/release-notes/${tag}.md`, 'utf8').trim();
            const { data: release } = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag
            });
            const ver = tag.replace(/^v/, '');
            const base = 'https://download.cursorxyz.it.com';
            const body = [
              `## EasyAIConfig ${tag}`,
              '',
              '> **首次安装请下 `.dmg` / `.exe` / `.AppImage`。** `.app.tar.gz` 仅供应用内自动更新。',
              '',
              '### 📦 下载（用户安装包）',
              '| 平台 | 链接 |',
              '|------|------|',
              `| macOS Apple Silicon | ${base}/EasyAIConfig_${ver}_aarch64.dmg |`,
              `| macOS Intel | ${base}/EasyAIConfig_${ver}_x64.dmg |`,
              `| Windows | ${base}/EasyAIConfig_${ver}_x64-setup.exe |`,
              `| Linux AppImage | ${base}/EasyAIConfig_${ver}_amd64.AppImage |`,
              `| Android APK | ${base}/EasyAIConfig_${ver}.apk |`,
              '',
              '### 🍎 macOS 安装说明',
              '下载 `.dmg` 后拖入 Applications，首次打开前运行：',
              '```bash',
              'sudo xattr -rd com.apple.quarantine /Applications/EasyAIConfig.app',
              '```',
              '然后正常双击打开即可。',
              '',
              '### 更新日志',
              changelog,
            ].join('\n');
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              name: `EasyAIConfig ${tag}`,
              body
            });
