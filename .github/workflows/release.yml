name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  R2_PUBLIC_BASE: https://download.cursorxyz.it.com

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      tag: ${{ steps.get-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Get tag
        id: get-tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Release (notes only — binaries on R2)
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const tag = '${{ steps.get-tag.outputs.tag }}';
            const ver = tag.replace(/^v/, '');
            const base = '${{ env.R2_PUBLIC_BASE }}'.replace(/\/$/, '');
            const notesPath = `.github/release-notes/${tag}.md`;
            let changelog = '';
            if (fs.existsSync(notesPath)) {
              changelog = fs.readFileSync(notesPath, 'utf8').trim();
            } else {
              try {
                const { data } = await github.rest.repos.generateReleaseNotes({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  tag_name: tag,
                  target_commitish: context.sha
                });
                changelog = data.body.trim();
              } catch (error) {
                core.warning(`Unable to generate release notes: ${error.message}`);
                changelog = '- 本版本包含稳定性改进与问题修复。';
              }
            }
            const body = [
              `## EasyAIConfig ${tag}`,
              '',
              '> 安装包在 Cloudflare R2（不占 GitHub 空间）。点下面链接下载。**macOS 请下 `.dmg`**；`.app.tar.gz` 只给应用内自动更新。',
              '',
              '### 📦 本版本下载',
              `| 平台 | 链接 |`,
              `|------|------|`,
              `| macOS Apple Silicon | ${base}/EasyAIConfig_${ver}_aarch64.dmg |`,
              `| macOS Intel | ${base}/EasyAIConfig_${ver}_x64.dmg |`,
              `| Windows | ${base}/EasyAIConfig_${ver}_x64-setup.exe |`,
              `| Linux AppImage | ${base}/EasyAIConfig_${ver}_amd64.AppImage |`,
              `| Android APK | ${base}/EasyAIConfig_${ver}.apk |`,
              '',
              '### 📦 固定最新入口（始终最新版）',
              `| 平台 | 链接 |`,
              `|------|------|`,
              `| macOS Apple Silicon | ${base}/EasyAIConfig_aarch64.dmg |`,
              `| macOS Intel | ${base}/EasyAIConfig_x64.dmg |`,
              `| Windows | ${base}/EasyAIConfig_x64-setup.exe |`,
              `| Linux AppImage | ${base}/EasyAIConfig_amd64.AppImage |`,
              `| Android APK | ${base}/EasyAIConfig.apk |`,
              '',
              '### 🔄 自动更新清单',
              `| | 链接 |`,
              `|---|------|`,
              `| R2 | ${base}/latest.json |`,
              `| GitHub（仅清单） | https://github.com/${context.repo.owner}/${context.repo.repo}/releases/latest/download/latest.json |`,
              '',
              '### 🍎 macOS 安装说明',
              '下载 `.dmg` 后拖入 Applications；首次打开若被拦截，可运行：',
              '```bash',
              'sudo xattr -rd com.apple.quarantine /Applications/EasyAIConfig.app',
              '```',
              '',
              '### 更新日志',
              changelog,
            ].join('\n');
            let release;
            try {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `EasyAIConfig ${tag}`,
                body,
                draft: true,
                prerelease: false
              });
              release = data;
            } catch (error) {
              if (error.status !== 422) {
                throw error;
              }
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag
              });
              const { data: updatedRelease } = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: data.id,
                name: `EasyAIConfig ${tag}`,
                body
              });
              release = updatedRelease;
            }
            return release.id;

  build-tauri:
    needs: create-release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
            updater_platform: darwin-aarch64
            artifact_name: updater-darwin-aarch64
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
            updater_platform: darwin-x86_64
            artifact_name: updater-darwin-x86_64
          - platform: windows-latest
            args: ''
            rust_target: ''
            updater_platform: windows-x86_64
            artifact_name: updater-windows-x86_64
          - platform: ubuntu-22.04
            args: ''
            rust_target: ''
            updater_platform: linux-x86_64
            artifact_name: updater-linux-x86_64
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare updater endpoint (R2 only)
        shell: bash
        run: |
          set -euo pipefail
          base='${{ secrets.CF_R2_PUBLIC_BASE_URL }}'
          base="${base:-${{ env.R2_PUBLIC_BASE }}}"
          base="${base%/}"
          endpoint="$base/latest.json"
          echo "EASYAICONFIG_UPDATER_ENDPOINT=$endpoint" >> "$GITHUB_ENV"
          printf '%s\n' "$base" > src-tauri/r2-public-base.url
          EASYAICONFIG_UPDATER_ENDPOINT="$endpoint" python3 - <<'PY'
          import json, os
          from pathlib import Path
          endpoint = os.environ['EASYAICONFIG_UPDATER_ENDPOINT']
          path = Path('src-tauri/tauri.conf.json')
          cfg = json.loads(path.read_text(encoding='utf-8'))
          cfg.setdefault('plugins', {}).setdefault('updater', {})['endpoints'] = [endpoint]
          path.write_text(json.dumps(cfg, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('updater endpoints:', [endpoint])
          PY

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libssl-dev

      - name: Install npm dependencies
        run: npm ci || npm install

      # 不传 releaseId：大包只上 R2，GitHub Release 只挂 latest.json + 介绍里的下载链接
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          EASYAICONFIG_UPDATER_ENDPOINT: ${{ env.EASYAICONFIG_UPDATER_ENDPOINT }}
        with:
          args: ${{ matrix.args }}

      - name: Collect updater + install bundles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/updater
          release_version='${{ needs.create-release.outputs.tag }}'
          release_version="${release_version#v}"
          case '${{ matrix.updater_platform }}' in
            darwin-aarch64)
              asset=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/macos -type f -name '*.app.tar.gz' | head -n 1)
              dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' | head -n 1)
              ;;
            darwin-x86_64)
              asset=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/macos -type f -name '*.app.tar.gz' | head -n 1)
              dmg=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -type f -name '*.dmg' | head -n 1)
              ;;
            windows-x86_64)
              asset=$(find src-tauri/target/release/bundle/nsis -type f -name '*-setup.exe' | head -n 1)
              dmg=''
              ;;
            linux-x86_64)
              asset=$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' | head -n 1)
              dmg=''
              ;;
            *)
              echo 'unsupported updater platform'
              exit 1
              ;;
          esac
          test -n "${asset:-}"
          sig="${asset}.sig"
          test -f "$sig"
          asset_name=$(basename "$asset")
          case '${{ matrix.updater_platform }}' in
            darwin-aarch64)
              # .app.tar.gz → 应用内自动更新；.dmg → 用户首次安装
              renamed="EasyAIConfig_${release_version}_aarch64.app.tar.gz"
              cp "$asset" "dist/updater/${renamed}"
              cp "$sig" "dist/updater/${renamed}.sig"
              asset_name="$renamed"
              test -n "${dmg:-}"
              cp "$dmg" "dist/updater/EasyAIConfig_${release_version}_aarch64.dmg"
              ;;
            darwin-x86_64)
              renamed="EasyAIConfig_${release_version}_x64.app.tar.gz"
              cp "$asset" "dist/updater/${renamed}"
              cp "$sig" "dist/updater/${renamed}.sig"
              asset_name="$renamed"
              test -n "${dmg:-}"
              cp "$dmg" "dist/updater/EasyAIConfig_${release_version}_x64.dmg"
              ;;
            *)
              cp "$asset" dist/updater/
              cp "$sig" dist/updater/
              ;;
          esac
          signature=$(tr -d '\r' < "dist/updater/${asset_name}.sig" | head -n 1)
          jq -n \
            --arg platform '${{ matrix.updater_platform }}' \
            --arg asset "$asset_name" \
            --arg signature "$signature" \
            '{platform:$platform,asset:$asset,signature:$signature}' \
            > "dist/updater/${{ matrix.updater_platform }}.manifest.json"
          ls -lah dist/updater

      - name: Upload updater artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/updater/*
          if-no-files-found: error

  build-apk:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build release APK
        working-directory: EasyAIConfig
        run: |
          flutter pub get
          flutter build apk --release
          ver='${{ needs.create-release.outputs.tag }}'
          ver="${ver#v}"
          mkdir -p ../dist/apk
          cp build/app/outputs/flutter-apk/app-release.apk "../dist/apk/EasyAIConfig_${ver}.apk"
          sha256sum "../dist/apk/EasyAIConfig_${ver}.apk" | awk '{print $1}' > "../dist/apk/EasyAIConfig_${ver}.apk.sha256"
          ls -lah ../dist/apk

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: dist/apk/*
          if-no-files-found: error

  publish-r2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [create-release, build-tauri, build-apk]
    if: always() && needs.create-release.result == 'success' && needs.build-tauri.result == 'success'
    env:
      CF_R2_ACCOUNT_ID: ${{ secrets.CF_R2_ACCOUNT_ID }}
      CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
      CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
      CF_R2_BUCKET: ${{ secrets.CF_R2_BUCKET }}
      CF_R2_PUBLIC_BASE_URL: ${{ secrets.CF_R2_PUBLIC_BASE_URL }}
      CF_R2_ENDPOINT: https://${{ secrets.CF_R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      RELEASE_TAG: ${{ needs.create-release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Check R2 settings
        id: r2
        shell: bash
        run: |
          # 允许 Secret 为空时回退到默认公开域（仍需账号密钥才能上传）
          if [ -z "${CF_R2_PUBLIC_BASE_URL}" ]; then
            echo "CF_R2_PUBLIC_BASE_URL=${{ env.R2_PUBLIC_BASE }}" >> "$GITHUB_ENV"
            export CF_R2_PUBLIC_BASE_URL='${{ env.R2_PUBLIC_BASE }}'
          fi
          missing=0
          for key in CF_R2_ACCOUNT_ID CF_R2_ACCESS_KEY_ID CF_R2_SECRET_ACCESS_KEY CF_R2_BUCKET; do
            if [ -z "${!key}" ]; then
              echo "missing: $key"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Skip R2 upload
        if: steps.r2.outputs.enabled != 'true'
        run: echo 'Cloudflare R2 secrets 未配置，跳过上传。'

      - name: Install R2 tools
        if: steps.r2.outputs.enabled == 'true'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user awscli
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Download updater artifacts
        if: steps.r2.outputs.enabled == 'true'
        uses: actions/download-artifact@v4
        with:
          path: dist/r2
          pattern: updater-*
          merge-multiple: true

      - name: Download APK artifact
        if: steps.r2.outputs.enabled == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          path: dist/r2
          name: apk-android
          merge-multiple: true

      - name: Build latest.json
        if: steps.r2.outputs.enabled == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime, glob, json, os
          from pathlib import Path

          base = (os.environ.get('CF_R2_PUBLIC_BASE_URL') or os.environ.get('R2_PUBLIC_BASE') or '').rstrip('/')
          if not base:
              base = 'https://download.cursorxyz.it.com'
          version = os.environ['RELEASE_TAG'].lstrip('v')
          manifests = []
          for manifest_path in sorted(glob.glob('dist/r2/*.manifest.json')):
              with open(manifest_path, 'r', encoding='utf-8') as handle:
                  manifests.append(json.load(handle))
          if not manifests:
              raise SystemExit('no updater manifests found')

          latest = {
              'version': version,
              'notes': '',
              'pub_date': datetime.datetime.now(datetime.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'platforms': {},
          }
          for item in manifests:
              latest['platforms'][item['platform']] = {
                  'signature': item['signature'],
                  'url': f"{base}/{item['asset']}",
              }

          # Android 不能放进 platforms：Tauri updater 要求每项都有 signature，
          # 否则整个 latest.json 反序列化失败，旧客户端会误显示「已是最新」。
          apk_name = f'EasyAIConfig_{version}.apk'
          apk_path = Path('dist/r2') / apk_name
          sha_path = Path('dist/r2') / f'{apk_name}.sha256'
          if apk_path.is_file():
              sha = sha_path.read_text(encoding='utf-8').strip().split()[0] if sha_path.is_file() else ''
              entry = {'url': f'{base}/{apk_name}'}
              if sha:
                  entry['sha256'] = sha
              latest['mobile'] = {
                  'android-arm64': entry,
                  'android': entry,
              }
          else:
              print('warning: APK not found, skipping mobile section')

          Path('dist/r2/latest.json').write_text(
              json.dumps(latest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(Path('dist/r2/latest.json').read_text(encoding='utf-8'))
          PY

      - name: Upload assets to R2
        if: steps.r2.outputs.enabled == 'true'
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          base="${CF_R2_PUBLIC_BASE_URL:-${{ env.R2_PUBLIC_BASE }}}"
          base="${base%/}"
          ver="${RELEASE_TAG#v}"
          aws s3 sync dist/r2 "s3://${CF_R2_BUCKET}/" \
            --endpoint-url "${CF_R2_ENDPOINT}" \
            --exclude '*.manifest.json' \
            --exclude '*.sha256' \
            --exclude 'latest.json'

          # 固定文件名别名：README / Release 介绍可永久指向
          copy_alias() {
            local src="$1"
            local dst="$2"
            if [ -f "dist/r2/${src}" ]; then
              aws s3 cp "dist/r2/${src}" "s3://${CF_R2_BUCKET}/${dst}" \
                --endpoint-url "${CF_R2_ENDPOINT}" \
                --cache-control 'no-store, no-cache, must-revalidate, max-age=0'
              echo "alias: ${base}/${dst} <- ${src}"
            else
              echo "skip alias (missing): ${src}"
            fi
          }
          copy_alias "EasyAIConfig_${ver}_aarch64.dmg" "EasyAIConfig_aarch64.dmg"
          copy_alias "EasyAIConfig_${ver}_x64.dmg" "EasyAIConfig_x64.dmg"
          copy_alias "EasyAIConfig_${ver}_x64-setup.exe" "EasyAIConfig_x64-setup.exe"
          copy_alias "EasyAIConfig_${ver}_amd64.AppImage" "EasyAIConfig_amd64.AppImage"
          copy_alias "EasyAIConfig_${ver}.apk" "EasyAIConfig.apk"

          aws s3 cp dist/r2/latest.json "s3://${CF_R2_BUCKET}/latest.json" \
            --endpoint-url "${CF_R2_ENDPOINT}" \
            --cache-control 'no-store, no-cache, must-revalidate, max-age=0' \
            --content-type 'application/json'
          echo "R2 updater endpoint: ${base}/latest.json"
          echo "Stable macOS arm64: ${base}/EasyAIConfig_aarch64.dmg"
          echo "APK: ${base}/EasyAIConfig.apk"

      - name: Upload latest.json to GitHub Release
        if: steps.r2.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/r2/latest.json
          # 只挂几 KB 的清单；安装包全在 R2，Release 介绍里给下载链接
          gh release upload "${RELEASE_TAG}" dist/r2/latest.json --clobber
          echo "GitHub updater endpoint: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/latest.json"

  publish-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    needs: [create-release, build-tauri, build-apk, publish-r2]
    if: always() && needs.create-release.result == 'success' && needs.publish-r2.result == 'success'
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: process.env.release_id,
              draft: false,
              prerelease: false
            });
