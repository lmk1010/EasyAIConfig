[package]
name = "easy_ai_config"
version = "1.0.73"
description = "EasyAIConfig desktop app"
authors = ["EasyAIConfig Contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "easy_ai_config_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
local-ip-address = "0.6"
dirs = "6"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "socks"] }
rusqlite = { version = "0.31", features = ["bundled"] }
semver = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
portable-pty = "0.8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
uuid = { version = "1", features = ["v4"] }
vt100 = "0.15"
tauri = { version = "2.10.3", features = ["macos-private-api", "tray-icon", "image-png"] }
tokio = { version = "1", features = ["rt"] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
toml = "0.8"
url = "2"
which = "8"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
