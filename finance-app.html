<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简易财务管理</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f5; min-height: 100vh; padding: 20px; }
.container { max-width: 900px; margin: 0 auto; }
h1 { text-align: center; color: #1a1a2e; margin-bottom: 24px; font-size: 28px; }

/* 概览卡片 */
.summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
.card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card h3 { font-size: 13px; color: #666; margin-bottom: 8px; text-transform: uppercase; }
.card .amount { font-size: 24px; font-weight: 700; }
.card.income .amount { color: #10b981; }
.card.expense .amount { color: #ef4444; }
.card.balance .amount { color: #3b82f6; }

/* 表单 */
.form-section { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 24px; }
.form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.form-group { flex: 1; min-width: 120px; }
.form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; outline: none; transition: border-color 0.2s; }
.form-group input:focus, .form-group select:focus { border-color: #3b82f6; }
.btn { padding: 10px 24px; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.btn-primary { background: #3b82f6; color: #fff; }
.btn-primary:hover { background: #2563eb; }
.btn-danger { background: #fee2e2; color: #ef4444; font-size: 12px; padding: 6px 12px; }
.btn-danger:hover { background: #ef4444; color: #fff; }

/* 记录列表 */
.records-section { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.records-section h2 { font-size: 18px; color: #333; margin-bottom: 16px; }
.filter-row { display: flex; gap: 8px; margin-bottom: 16px; }
.filter-btn { padding: 6px 16px; border: 1px solid #ddd; border-radius: 20px; background: #fff; font-size: 13px; cursor: pointer; transition: all 0.2s; }
.filter-btn.active { background: #3b82f6; color: #fff; border-color: #3b82f6; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px 8px; border-bottom: 2px solid #eee; font-size: 13px; color: #666; }
td { padding: 12px 8px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }
tr:hover { background: #f8fafc; }
.tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; }
.tag-income { background: #d1fae5; color: #065f46; }
.tag-expense { background: #fee2e2; color: #991b1b; }
.empty { text-align: center; padding: 40px; color: #999; }

/* 图表 */
.chart-bar { height: 8px; border-radius: 4px; margin-top: 4px; transition: width 0.3s; }

@media (max-width: 600px) {
  .summary { grid-template-columns: 1fr; }
  .form-row { flex-direction: column; }
}
</style>
</head>
<body>
<div class="container">
  <h1>💰 简易财务管理</h1>

  <div class="summary">
    <div class="card income"><h3>总收入</h3><div class="amount" id="totalIncome">¥0.00</div></div>
    <div class="card expense"><h3>总支出</h3><div class="amount" id="totalExpense">¥0.00</div></div>
    <div class="card balance"><h3>结余</h3><div class="amount" id="totalBalance">¥0.00</div></div>
  </div>

  <div class="form-section">
    <div class="form-row">
      <div class="form-group">
        <label>类型</label>
        <select id="type">
          <option value="expense">支出</option>
          <option value="income">收入</option>
        </select>
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="category">
          <option value="餐饮">餐饮</option>
          <option value="交通">交通</option>
          <option value="购物">购物</option>
          <option value="住房">住房</option>
          <option value="工资">工资</option>
          <option value="投资">投资</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>金额</label>
        <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
      </div>
      <div class="form-group">
        <label>日期</label>
        <input type="date" id="date">
      </div>
      <div class="form-group">
        <label>备注</label>
        <input type="text" id="note" placeholder="可选">
      </div>
      <button class="btn btn-primary" onclick="addRecord()">添加</button>
    </div>
  </div>

  <div class="records-section">
    <h2>交易记录</h2>
    <div class="filter-row">
      <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
      <button class="filter-btn" onclick="setFilter('income', this)">收入</button>
      <button class="filter-btn" onclick="setFilter('expense', this)">支出</button>
    </div>
    <table>
      <thead><tr><th>日期</th><th>类型</th><th>分类</th><th>金额</th><th>备注</th><th>操作</th></tr></thead>
      <tbody id="recordsBody"></tbody>
    </table>
    <div class="empty" id="emptyMsg">暂无记录，添加第一笔吧 ✨</div>
  </div>
</div>

<script>
let records = JSON.parse(localStorage.getItem('finance_records') || '[]');
let currentFilter = 'all';

// 初始化日期为今天
document.getElementById('date').valueAsDate = new Date();

function save() {
  localStorage.setItem('finance_records', JSON.stringify(records));
}

function addRecord() {
  const type = document.getElementById('type').value;
  const category = document.getElementById('category').value;
  const amount = parseFloat(document.getElementById('amount').value);
  const date = document.getElementById('date').value;
  const note = document.getElementById('note').value.trim();

  if (!amount || amount <= 0) { alert('请输入有效金额'); return; }
  if (!date) { alert('请选择日期'); return; }

  records.push({ id: Date.now(), type, category, amount, date, note });
  records.sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
  save();
  render();

  document.getElementById('amount').value = '';
  document.getElementById('note').value = '';
}

function deleteRecord(id) {
  records = records.filter(r => r.id !== id);
  save();
  render();
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const filtered = currentFilter === 'all' ? records : records.filter(r => r.type === currentFilter);
  const tbody = document.getElementById('recordsBody');
  const empty = document.getElementById('emptyMsg');

  if (filtered.length === 0) {
    tbody.innerHTML = '';
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tbody.innerHTML = filtered.map(r => `
      <tr>
        <td>${r.date}</td>
        <td><span class="tag tag-${r.type}">${r.type === 'income' ? '���入' : '支出'}</span></td>
        <td>${r.category}</td>
        <td style="font-weight:600;color:${r.type === 'income' ? '#10b981' : '#ef4444'}">
          ${r.type === 'income' ? '+' : '-'}¥${r.amount.toFixed(2)}
        </td>
        <td style="color:#888">${r.note || '-'}</td>
        <td><button class="btn btn-danger" onclick="deleteRecord(${r.id})">删除</button></td>
      </tr>
    `).join('');
  }

  // 更新汇总
  const income = records.filter(r => r.type === 'income').reduce((s, r) => s + r.amount, 0);
  const expense = records.filter(r => r.type === 'expense').reduce((s, r) => s + r.amount, 0);
  document.getElementById('totalIncome').textContent = `¥${income.toFixed(2)}`;
  document.getElementById('totalExpense').textContent = `¥${expense.toFixed(2)}`;
  document.getElementById('totalBalance').textContent = `¥${(income - expense).toFixed(2)}`;
}

render();
</script>
</body>
</html>
